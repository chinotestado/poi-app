<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poi — Alab MNL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --black: #090909; --dark: #111111; --card: #181818; --smoke: #2A2A2A;
  --border: #2E2E2E; --fire: #E8007D; --fire2: #FF1A8C; --amber: #E8007D;
  --purple: #8B3FD4; --white: #F5F3EF; --muted: #888480; --muted2: #4A4845;
  --stress: #E8007D; --bench: #4A9B3F; --log: #E8007D;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif; background: var(--black); color: var(--white);
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 20px; position: relative; overflow-x: hidden;
}
body::before {
  content: ''; position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none; z-index: 1000; opacity: 0.4;
}
body::after {
  content: ''; position: fixed; bottom: -200px; left: 50%; transform: translateX(-50%);
  width: 600px; height: 400px;
  background: radial-gradient(ellipse, rgba(232,0,125,0.08) 0%, transparent 70%);
  pointer-events: none; z-index: 0;
}
#app {
  width: 100%; max-width: 780px; display: flex; flex-direction: column;
  border: 1px solid var(--border); border-radius: 2px; overflow: hidden;
  background: var(--dark); position: relative; z-index: 1;
  box-shadow: 0 0 0 1px rgba(232,0,125,0.08), 0 32px 80px rgba(0,0,0,0.8);
  animation: fadeIn 0.6s ease forwards;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
#header { padding: 16px 20px 0; background: var(--black); border-bottom: 1px solid var(--border); flex-shrink: 0; }
#header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
#brand { display: flex; align-items: center; gap: 12px; }
#brand-mark {
  font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 3px;
  color: var(--fire); line-height: 1; text-shadow: 0 0 20px rgba(232,0,125,0.4);
}
#brand-divider { width: 1px; height: 24px; background: var(--border); }
#brand-name { font-size: 11px; color: var(--muted); letter-spacing: 2px; font-family: 'DM Mono', monospace; text-transform: uppercase; }
#header-controls { display: flex; align-items: center; gap: 8px; }
.badge { font-size: 10px; padding: 3px 9px; border-radius: 1px; font-family: 'DM Mono', monospace; letter-spacing: 1px; border: 1px solid; display: flex; align-items: center; gap: 4px; }
.badge-fire { background: rgba(232,0,125,0.1); color: var(--fire); border-color: rgba(232,0,125,0.3); }
.badge-secure { background: rgba(74,152,63,0.08); color: #6BC760; border-color: rgba(74,152,63,0.25); }
#clr-btn { font-size: 11px; padding: 4px 10px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; font-family: 'DM Sans', sans-serif; border-radius: 1px; transition: all 0.15s; }
#clr-btn:hover { border-color: var(--fire); color: var(--fire); }
#tabs { display: flex; }
.tab { flex: 1; padding: 9px 8px; font-size: 11px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; border: none; background: transparent; cursor: pointer; color: var(--muted2); border-bottom: 2px solid transparent; font-family: 'DM Mono', monospace; transition: all 0.15s; display: flex; align-items: center; justify-content: center; gap: 6px; }
.tab:hover { color: var(--muted); }
.tab.active-stress { color: var(--stress); border-bottom-color: var(--stress); }
.tab.active-bench { color: var(--bench); border-bottom-color: var(--bench); }
.tab.active-log { color: var(--log); border-bottom-color: var(--log); }
.tab-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: 0.6; }
.tab-count { font-size: 9px; padding: 1px 5px; border-radius: 1px; background: var(--log); color: var(--black); font-weight: 600; display: none; }
#body { flex: 1; overflow: hidden; display: flex; flex-direction: column; min-height: 480px; }
#chat { display: flex; flex-direction: column; height: 100%; }
#messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; min-height: 380px; max-height: 420px; }
#messages::-webkit-scrollbar { width: 3px; }
#messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.msg { display: flex; flex-direction: column; max-width: 86%; animation: msgIn 0.25s ease forwards; }
@keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.msg.u { align-self: flex-end; align-items: flex-end; }
.msg.a { align-self: flex-start; align-items: flex-start; }
.msg.sys { align-self: center; align-items: center; max-width: 100%; }
.bubble { padding: 11px 15px; font-size: 13.5px; line-height: 1.7; color: var(--white); border-radius: 2px; }
.msg.u .bubble { background: var(--fire); color: var(--white); border-bottom-right-radius: 0; }
.msg.a .bubble { background: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 0; color: #E8E4DE; }
.msg.sys .bubble { font-size: 10px; color: var(--muted2); padding: 4px 12px; background: transparent; border: 1px solid var(--border); font-family: 'DM Mono', monospace; letter-spacing: 1px; }
.meta { font-size: 10px; color: var(--muted2); margin-top: 4px; padding: 0 3px; display: flex; align-items: center; gap: 8px; font-family: 'DM Mono', monospace; letter-spacing: 0.5px; }
.log-btn { font-size: 9px; padding: 2px 8px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; font-family: 'DM Mono', monospace; letter-spacing: 1px; border-radius: 1px; transition: all 0.15s; text-transform: uppercase; }
.log-btn:hover { border-color: var(--fire); color: var(--fire); }
.picker { display: none; flex-wrap: wrap; gap: 4px; padding: 6px 3px 2px; align-items: center; }
.picker-label { font-size: 10px; color: var(--muted2); font-family: 'DM Mono', monospace; letter-spacing: 1px; text-transform: uppercase; width: 100%; margin-bottom: 2px; }
.stage-btn { font-size: 9px; padding: 3px 9px; border: 1px solid; cursor: pointer; font-family: 'DM Mono', monospace; letter-spacing: 1px; background: transparent; border-radius: 1px; text-transform: uppercase; transition: opacity 0.1s; }
.stage-btn:hover { opacity: 0.75; }
.dots { display: flex; gap: 5px; align-items: center; padding: 4px 0; }
.dot { width: 4px; height: 4px; border-radius: 50%; background: var(--fire); animation: pulse 1.4s infinite; opacity: 0.6; }
.dot:nth-child(2) { animation-delay: 0.2s; } .dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes pulse { 0%,60%,100% { transform: scale(1); opacity: 0.4; } 30% { transform: scale(1.4); opacity: 1; } }
#file-preview { display: none; padding: 8px 16px 0; background: var(--black); }
#file-list { display: flex; flex-wrap: wrap; gap: 6px; }
.file-chip { display: flex; align-items: center; gap: 5px; font-size: 10px; padding: 3px 8px; border-radius: 1px; background: var(--card); border: 1px solid var(--border); color: var(--muted); font-family: 'DM Mono', monospace; letter-spacing: 0.5px; }
.file-chip-remove { cursor: pointer; color: var(--muted2); font-size: 12px; line-height: 1; transition: color 0.1s; }
.file-chip-remove:hover { color: var(--fire); }
.file-chip.ready { border-color: rgba(232,0,125,0.4); color: var(--fire); }
#input-wrap { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: flex-end; background: var(--black); flex-shrink: 0; }
#upload-btn { width: 36px; height: 36px; border: 1px solid var(--border); border-radius: 1px; background: transparent; color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 16px; transition: all 0.15s; }
#upload-btn:hover { border-color: var(--fire); color: var(--fire); }
#inp { flex: 1; padding: 9px 13px; font-size: 13.5px; border: 1px solid var(--border); border-radius: 1px; resize: none; background: var(--card); color: var(--white); font-family: 'DM Sans', sans-serif; line-height: 1.5; max-height: 100px; overflow-y: auto; transition: border-color 0.15s, box-shadow 0.15s; }
#inp:focus { outline: none; border-color: var(--fire); box-shadow: 0 0 0 3px rgba(232,0,125,0.08); }
#inp::placeholder { color: var(--muted2); }
#send { width: 36px; height: 36px; border: none; background: var(--fire); color: var(--white); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; border-radius: 1px; transition: background 0.15s; font-size: 15px; }
#send:hover { background: var(--fire2); }
#send:disabled { opacity: 0.3; cursor: not-allowed; }
#dlog { display: none; flex-direction: column; flex: 1; overflow: hidden; }
#dl-head { padding: 14px 20px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
#dl-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
#dl-title { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }
#dl-add { font-size: 10px; padding: 4px 12px; border: 1px solid rgba(232,0,125,0.4); background: transparent; color: var(--fire); cursor: pointer; font-family: 'DM Mono', monospace; letter-spacing: 1px; text-transform: uppercase; border-radius: 1px; transition: all 0.15s; }
#dl-add:hover { background: rgba(232,0,125,0.08); }
#dl-filters { display: flex; gap: 5px; flex-wrap: wrap; }
.filter-btn { font-size: 9px; padding: 3px 9px; border: 1px solid var(--border); background: transparent; color: var(--muted2); cursor: pointer; font-family: 'DM Mono', monospace; letter-spacing: 1px; text-transform: uppercase; border-radius: 1px; transition: all 0.12s; }
.filter-btn:hover { color: var(--muted); border-color: var(--muted2); }
#dl-form { display: none; flex-direction: column; gap: 8px; padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--card); flex-shrink: 0; }
#dl-form.open { display: flex; }
#dl-form input, #dl-form textarea, #dl-form select { padding: 8px 11px; font-size: 13px; border: 1px solid var(--border); border-radius: 1px; background: var(--dark); color: var(--white); font-family: 'DM Sans', sans-serif; transition: border-color 0.15s; }
#dl-form input:focus, #dl-form textarea:focus, #dl-form select:focus { outline: none; border-color: var(--fire); }
#dl-form select option { background: var(--dark); }
#dl-form textarea { resize: none; height: 60px; line-height: 1.5; }
#dl-form-btns { display: flex; gap: 7px; }
#dl-save { padding: 6px 16px; border: none; background: var(--fire); color: var(--black); font-size: 11px; cursor: pointer; font-family: 'DM Mono', monospace; letter-spacing: 1px; text-transform: uppercase; border-radius: 1px; font-weight: 600; }
#dl-cancel { padding: 6px 14px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 11px; cursor: pointer; font-family: 'DM Mono', monospace; letter-spacing: 1px; border-radius: 1px; }
#dl-list { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 0; }
#dl-list::-webkit-scrollbar { width: 3px; }
#dl-list::-webkit-scrollbar-thumb { background: var(--border); }
#dl-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 10px; color: var(--muted2); text-align: center; font-family: 'DM Mono', monospace; letter-spacing: 1px; font-size: 11px; text-transform: uppercase; }
#dl-empty .empty-mark { font-family: 'Bebas Neue', sans-serif; font-size: 40px; color: var(--border); letter-spacing: 4px; }
.dec-item { display: flex; gap: 13px; padding-bottom: 16px; position: relative; animation: msgIn 0.25s ease forwards; }
.dec-item:not(:last-child)::before { content: ''; position: absolute; left: 14px; top: 30px; bottom: 0; width: 1px; background: var(--border); }
.dec-dot { width: 28px; height: 28px; border-radius: 1px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; flex-shrink: 0; margin-top: 2px; font-family: 'DM Mono', monospace; letter-spacing: 0.5px; border: 1px solid; }
.dec-card { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 1px; padding: 10px 13px; }
.dec-stage { display: inline-flex; align-items: center; font-size: 9px; padding: 2px 7px; margin-bottom: 6px; font-family: 'DM Mono', monospace; letter-spacing: 1px; text-transform: uppercase; border: 1px solid; border-radius: 1px; }
.dec-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 5px; }
.dec-title { font-size: 13px; font-weight: 500; color: var(--white); line-height: 1.4; }
.dec-date { font-size: 9px; color: var(--muted2); white-space: nowrap; flex-shrink: 0; font-family: 'DM Mono', monospace; }
.dec-rationale { font-size: 12px; color: var(--muted); line-height: 1.6; }
.dec-source { font-size: 9px; color: var(--muted2); margin-top: 6px; font-family: 'DM Mono', monospace; letter-spacing: 0.5px; text-transform: uppercase; }
#footer { padding: 7px 20px; border-top: 1px solid var(--border); background: var(--black); display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--muted2); flex-shrink: 0; font-family: 'DM Mono', monospace; letter-spacing: 0.5px; }
.footer-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--fire); opacity: 0.6; }
.footer-right { margin-left: auto; color: var(--muted2); font-size: 9px; letter-spacing: 1px; }
</style>
</head>
<body>
<!-- PASSWORD GATE -->
<div id="gate" style="width:100%;max-width:480px;position:relative;z-index:1;animation:fadeIn 0.6s ease forwards;">
  <div style="border:1px solid #2E2E2E;border-radius:2px;background:#111111;padding:40px;box-shadow:0 0 0 1px rgba(232,0,125,0.08),0 32px 80px rgba(0,0,0,0.8);">
    <div style="font-family:'Bebas Neue',sans-serif;font-size:48px;letter-spacing:6px;color:#E8007D;line-height:1;text-shadow:0 0 30px rgba(232,0,125,0.4);margin-bottom:6px">POI</div>
    <div style="font-family:'DM Mono',monospace;font-size:10px;letter-spacing:3px;color:#4A4845;text-transform:uppercase;margin-bottom:32px">Alab MNL · Conviction AI · Beta</div>
    <div style="font-size:11px;color:#888480;font-family:'DM Mono',monospace;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px">Access Password</div>
    <div id="gate-error" style="display:none;font-size:11px;color:#E8007D;font-family:'DM Mono',monospace;letter-spacing:0.5px;margin-bottom:8px">Wrong password — please try again.</div>
    <input id="gate-input" type="password" placeholder="Enter password..." autocomplete="off" spellcheck="false"
      style="width:100%;padding:11px 13px;font-size:13px;border:1px solid #2E2E2E;border-radius:1px;background:#181818;color:#F5F3EF;font-family:'DM Mono',monospace;letter-spacing:1px;margin-bottom:10px;box-sizing:border-box;transition:border-color 0.15s;">
    <button onclick="unlock()" style="width:100%;padding:12px;border:none;background:#E8007D;color:#F5F3EF;font-size:12px;font-family:'DM Mono',monospace;letter-spacing:2px;text-transform:uppercase;cursor:pointer;border-radius:1px;font-weight:600;">Ignite Poi &#x279C;</button>
    <div style="font-size:10px;color:#4A4845;font-family:'DM Mono',monospace;letter-spacing:0.5px;margin-top:16px;line-height:1.6;text-align:center;">For Alab MNL internal use only.<br>Session only — cleared on close.</div>
  </div>
</div>

<div id="app" style="display:none;">
  <div id="header">
    <div id="header-top">
      <div id="brand">
        <div id="brand-mark">POI</div>
        <div id="brand-divider"></div>
        <div id="brand-name">Alab MNL · Conviction AI</div>
      </div>
      <div id="header-controls">
        <div class="badge badge-fire">Beta</div>
        <div class="badge badge-secure">&#x25CF; Session only</div>
        <button id="clr-btn" onclick="poiClear()">Clear</button>
      </div>
    </div>
    <div id="tabs">
      <button class="tab active-stress" id="tab-stress" onclick="setTab('stress')"><span class="tab-dot"></span>Stress-Test</button>
      <button class="tab" id="tab-bench" onclick="setTab('bench')"><span class="tab-dot"></span>Benchmark</button>
      <button class="tab" id="tab-log" onclick="setTab('log')"><span class="tab-dot"></span>Decision Log<span class="tab-count" id="tab-count">0</span></button>
    </div>
  </div>
  <div id="body">
    <div id="chat">
      <div id="messages"></div>
      <div id="file-preview"><div id="file-list"></div></div>
      <div id="input-wrap">
        <label id="upload-btn" title="Attach file">
          📎<input type="file" id="file-input" accept=".pdf,.png,.jpg,.jpeg,.gif,.webp" multiple style="display:none;" onchange="handleFiles(this.files)">
        </label>
        <textarea id="inp" rows="1" placeholder="Share your concept or brief — or attach a deck, storyboard, or brief..."></textarea>
        <button id="send" onclick="poiSend()" title="Send">&#x279C;</button>
      </div>
    </div>
    <div id="dlog">
      <div id="dl-head">
        <div id="dl-top">
          <div id="dl-title">Campaign Decision Log</div>
          <button id="dl-add" onclick="toggleForm()">+ Add Decision</button>
        </div>
        <div id="dl-filters"></div>
      </div>
      <div id="dl-form">
        <input id="df-title" type="text" placeholder="Decision title">
        <select id="df-stage"></select>
        <textarea id="df-rationale" placeholder="Rationale — what was decided and why?"></textarea>
        <div id="dl-form-btns">
          <button id="dl-save" onclick="saveDecision()">Save</button>
          <button id="dl-cancel" onclick="toggleForm()">Cancel</button>
        </div>
      </div>
      <div id="dl-list"></div>
    </div>
  </div>
  <div id="footer">
    <div class="footer-dot"></div>
    Session only — cleared on close
    <span class="footer-right">The dancer controls the fire</span>
  </div>
</div>
</div>

<script>
function unlock() {
  const input = document.getElementById('gate-input').value.trim();
  if (input !== 'AIL@b2026') {
    document.getElementById('gate-error').style.display = 'block';
    document.getElementById('gate-input').value = '';
    return;
  }
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  buildStageSelect();
  updateCount();
  setTab('stress');
}

document.addEventListener('DOMContentLoaded', function() {
  const gateInput = document.getElementById('gate-input');
  if (gateInput) {
    gateInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') unlock();
    });
  }
});

const STAGES = [
  { id:'briefing',   label:'Briefing',            short:'BR', bg:'rgba(232,0,125,0.1)',  border:'rgba(232,0,125,0.4)',  text:'#FF1A8C' },
  { id:'strategy',   label:'Strategy',             short:'ST', bg:'rgba(139,63,212,0.1)', border:'rgba(139,63,212,0.4)', text:'#B47FE8' },
  { id:'creative',   label:'Creative Dev',         short:'CD', bg:'rgba(232,0,125,0.08)', border:'rgba(232,0,125,0.3)',  text:'#E8007D' },
  { id:'production', label:'Production',           short:'PR', bg:'rgba(74,152,63,0.1)', border:'rgba(74,152,63,0.4)', text:'#6BC760' },
  { id:'media',      label:'Media Implementation', short:'MI', bg:'rgba(60,130,200,0.1)', border:'rgba(60,130,200,0.4)', text:'#6AABDF' },
];

const WELCOME = {
  stress: `Stress-Test active.\n\nShare your concept or brief — or attach a deck, storyboard, or document. I'll interrogate it through the Combustion Framework and tell you whether it burns, whether it's worth the burn, and whether it will linger.`,
  bench: `Benchmark active.\n\nShare your work or concept — I'll evaluate it against Cannes Lions, Adfest, and Philippine standards, and tell you exactly what makes it worth awarding and what's holding it back.`
};

let tab = 'stress';
let history = { stress: [], bench: [] };
let decisions = [];
let attachedFiles = [];
let loading = false;
let formOpen = false;
let activeFilter = 'all';
let decId = 1;

function stageById(id) { return STAGES.find(s => s.id === id) || STAGES[0]; }

function updateCount() {
  const el = document.getElementById('tab-count');
  el.textContent = decisions.length;
  el.style.display = decisions.length > 0 ? 'inline' : 'none';
}

function buildFilters() {
  const el = document.getElementById('dl-filters');
  el.innerHTML = '';
  const all = document.createElement('button');
  all.className = 'filter-btn';
  all.textContent = `All (${decisions.length})`;
  if (activeFilter === 'all') all.style.cssText = 'border-color:rgba(232,0,125,0.5);color:#E8007D;';
  all.onclick = () => { activeFilter = 'all'; renderLog(); };
  el.appendChild(all);
  STAGES.forEach(s => {
    const count = decisions.filter(d => d.stageId === s.id).length;
    if (count === 0) return;
    const b = document.createElement('button');
    b.className = 'filter-btn';
    b.textContent = `${s.label} (${count})`;
    if (activeFilter === s.id) b.style.cssText = `border-color:${s.border};color:${s.text};`;
    b.onclick = () => { activeFilter = s.id; renderLog(); };
    el.appendChild(b);
  });
}

function buildStageSelect() {
  const sel = document.getElementById('df-stage');
  sel.innerHTML = '';
  STAGES.forEach(s => {
    const o = document.createElement('option');
    o.value = s.id; o.textContent = s.label;
    sel.appendChild(o);
  });
}

function setTab(t) {
  tab = t;
  ['stress', 'bench', 'log'].forEach(x => {
    document.getElementById('tab-' + x).className = 'tab' + (x === t ? ` active-${x}` : '');
  });
  document.getElementById('chat').style.display = t === 'log' ? 'none' : 'flex';
  document.getElementById('dlog').style.display = t === 'log' ? 'flex' : 'none';
  if (t !== 'log') {
    document.getElementById('inp').placeholder = t === 'stress'
      ? 'Share your concept or brief — or attach a deck, storyboard, or brief...'
      : 'Share your work or concept — or attach a deck or storyboard...';
    renderChat();
  } else { buildFilters(); renderLog(); }
}

let filesProcessing = 0;

function handleFiles(files) {
  Array.from(files).forEach(file => {
    const chip = addFileChip(file.name);
    filesProcessing++;
    updateSendBtn();

    if (file.type.startsWith('image/')) {
      const img = new Image();
      const reader = new FileReader();
      reader.onload = (e) => {
        img.onload = () => {
          try {
            const canvas = document.createElement('canvas');
            const MAX = 1024;
            let w = img.width, h = img.height;
            if (w > MAX || h > MAX) {
              if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
              else { w = Math.round(w * MAX / h); h = MAX; }
            }
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            const compressed = canvas.toDataURL('image/jpeg', 0.8);
            const base64 = compressed.split(',')[1];
            attachedFiles.push({ name: file.name, base64, mediaType: 'image/jpeg', type: 'image' });
            chip.classList.add('ready');
          } catch(err) {
            // fallback: use original without compression
            const base64 = e.target.result.split(',')[1];
            attachedFiles.push({ name: file.name, base64, mediaType: file.type, type: 'image' });
            chip.classList.add('ready');
          }
          filesProcessing--;
          updateSendBtn();
        };
        img.onerror = () => { filesProcessing--; updateSendBtn(); chip.remove(); };
        img.src = e.target.result;
      };
      reader.onerror = () => { filesProcessing--; updateSendBtn(); chip.remove(); };
      reader.readAsDataURL(file);
    } else {
      const reader = new FileReader();
      reader.onload = (e) => {
        const base64 = e.target.result.split(',')[1];
        attachedFiles.push({ name: file.name, base64, mediaType: file.type, type: 'document' });
        chip.classList.add('ready');
        filesProcessing--;
        updateSendBtn();
      };
      reader.onerror = () => { filesProcessing--; updateSendBtn(); chip.remove(); };
      reader.readAsDataURL(file);
    }
  });
  document.getElementById('file-input').value = '';
}

function updateSendBtn() {
  const btn = document.getElementById('send');
  if (!btn) return;
  // Disable only during API call, not during file processing
  btn.disabled = loading;
  // Show processing state on button
  if (filesProcessing > 0) {
    btn.style.opacity = '0.6';
    btn.title = 'Processing file...';
  } else {
    btn.style.opacity = loading ? '0.3' : '1';
    btn.title = 'Send';
  }
}

function addFileChip(name) {
  const preview = document.getElementById('file-preview');
  const list = document.getElementById('file-list');
  preview.style.display = 'block';
  const chip = document.createElement('div');
  chip.className = 'file-chip';
  chip.innerHTML = `<span>📄 ${name.length > 20 ? name.substring(0,20)+'...' : name}</span><span class="file-chip-remove" onclick="removeFile('${name}', this.parentElement)">×</span>`;
  list.appendChild(chip);
  return chip;
}

function removeFile(name, chip) {
  attachedFiles = attachedFiles.filter(f => f.name !== name);
  chip.remove();
  if (document.getElementById('file-list').children.length === 0) {
    document.getElementById('file-preview').style.display = 'none';
  }
}

function renderChat() {
  const msgs = document.getElementById('messages');
  msgs.innerHTML = '';
  if (history[tab].length === 0) {
    const w = document.createElement('div');
    w.className = 'msg a';
    w.innerHTML = `<div class="bubble">${WELCOME[tab].replace(/\n/g, '<br>')}</div><div class="meta">Poi</div>`;
    msgs.appendChild(w);
  } else {
    history[tab].forEach((m, i) => {
      const div = document.createElement('div');
      div.className = `msg ${m.role === 'user' ? 'u' : 'a'}`;
      const txt = m.content
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
        .replace(/^(DOES IT BURN\?|IS IT WORTH THE BURN\?|WILL THE BURN LINGER\?|WHAT COULD KILL THE FLAME\?|ACTION|WORTH AWARDING\?|CREATIVE AMBITION\?|WILL IT BE REFERENCED\?|WHAT STOPS IT FROM WINNING\?)/gm, '<span style="font-size:11px;letter-spacing:2px;color:#E8007D;font-family:DM Mono,monospace;text-transform:uppercase;font-weight:600;display:block;margin-top:10px">$1</span>')
        .replace(/^(HEAT|FUEL|O2|AUDIENCE|RISK|REWARD|AWARD POTENTIAL|CREATIVE GAP|CANNES\/ADFEST STANDARD|PHILIPPINE STANDARD)/gm, '<span style="font-size:10px;letter-spacing:1px;color:#888480;font-family:DM Mono,monospace;text-transform:uppercase;display:block;margin-top:6px">$1</span>')
        .replace(/^---$/gm, '<hr style="border:none;border-top:1px solid #2E2E2E;margin:8px 0">')
        .replace(/\n/g,'<br>');
      if (m.role === 'user') {
        div.innerHTML = `<div class="bubble">${txt}</div><div class="meta">You</div>`;
      } else {
        div.innerHTML = `<div class="bubble">${txt}</div>
          <div class="meta" id="mt-${i}">Poi
            <button class="log-btn" id="lb-${i}" onclick="showPicker(${i})">Log this</button>
          </div>
          <div class="picker" id="pk-${i}">
            <div class="picker-label">Assign to stage:</div>
            ${STAGES.map(s => `<button class="stage-btn" style="color:${s.text};border-color:${s.border};background:${s.bg}" onclick="doLog(${i},'${s.id}')">${s.label}</button>`).join('')}
          </div>`;
      }
      msgs.appendChild(div);
    });
  }
  msgs.scrollTop = msgs.scrollHeight;
}

function showPicker(i) {
  const pk = document.getElementById('pk-' + i);
  const lb = document.getElementById('lb-' + i);
  if (pk && lb) { pk.style.display = 'flex'; lb.style.display = 'none'; }
}

function doLog(idx, stageId) {
  const msg = history[tab][idx];
  const prev = history[tab][idx - 1];
  const title = prev ? prev.content.substring(0, 72) + (prev.content.length > 72 ? '…' : '') : 'Poi evaluation';
  addDecision(title, msg.content.substring(0, 240) + (msg.content.length > 240 ? '…' : ''), stageId, tab === 'stress' ? 'Stress-Test' : 'Benchmark');
  const pk = document.getElementById('pk-' + idx);
  const mt = document.getElementById('mt-' + idx);
  if (pk) pk.style.display = 'none';
  if (mt) {
    const s = stageById(stageId);
    mt.innerHTML = `Poi <span style="font-size:9px;padding:2px 7px;border:1px solid ${s.border};color:${s.text};background:${s.bg};font-family:'DM Mono',monospace;letter-spacing:1px;text-transform:uppercase">✓ ${s.label}</span>`;
  }
}

function showLoader() {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.id = 'loader'; div.className = 'msg a';
  div.innerHTML = `<div class="bubble"><div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

async function poiSend() {
  const inp = document.getElementById('inp');
  const txt = inp.value.trim();
  if (!txt || loading) return;
  inp.value = ''; inp.style.height = 'auto';

  const userContent = attachedFiles.length > 0
    ? [...attachedFiles.map(f => f.type === 'image'
        ? { type: 'image', source: { type: 'base64', media_type: f.mediaType, data: f.base64 } }
        : { type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: f.base64 } }
      ), { type: 'text', text: txt }]
    : txt;

  history[tab].push({ role: 'user', content: userContent });
  loading = true;
  updateSendBtn();
  renderChat(); showLoader();

  const apiMessages = history[tab].map(m => ({
    role: m.role === 'user' ? 'user' : 'assistant',
    content: typeof m.content === 'string' ? m.content : m.content
  }));

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: apiMessages, tab })
    });
    const data = await res.json();
    const reply = data.content && data.content[0] ? data.content[0].text : (data.error ? `Error: ${data.error.message}` : 'Something went wrong. Please try again.');
    history[tab].push({ role: 'assistant', content: reply });
  } catch (e) {
    history[tab].push({ role: 'assistant', content: 'Connection issue — please try again.' });
  }

  const loader = document.getElementById('loader');
  if (loader) loader.remove();
  loading = false;
  updateSendBtn();
  attachedFiles = [];
  document.getElementById('file-list').innerHTML = '';
  document.getElementById('file-preview').style.display = 'none';
  renderChat();
}

function toggleForm() {
  formOpen = !formOpen;
  document.getElementById('dl-form').className = formOpen ? 'open' : '';
  if (formOpen) document.getElementById('df-title').focus();
}

function saveDecision() {
  const title = document.getElementById('df-title').value.trim();
  const rationale = document.getElementById('df-rationale').value.trim();
  const stage = document.getElementById('df-stage').value;
  if (!title) { document.getElementById('df-title').focus(); return; }
  addDecision(title, rationale, stage, 'Manual');
  document.getElementById('df-title').value = '';
  document.getElementById('df-rationale').value = '';
  toggleForm();
}

function addDecision(title, rationale, stageId, source) {
  const now = new Date();
  const date = now.toLocaleDateString('en-PH', { month: 'short', day: 'numeric', year: 'numeric' });
  decisions.push({ id: decId++, title, rationale, stageId, date, source: source || 'Manual' });
  updateCount();
  if (tab === 'log') { buildFilters(); renderLog(); }
}

function renderLog() {
  buildFilters();
  const list = document.getElementById('dl-list');
  list.innerHTML = '';
  const filtered = activeFilter === 'all' ? decisions : decisions.filter(d => d.stageId === activeFilter);
  if (filtered.length === 0) {
    list.innerHTML = `<div id="dl-empty"><div class="empty-mark">POI</div><div>No decisions logged yet</div><div style="font-size:10px;color:#4A4845;margin-top:4px">Use "Log this" on any Poi response or add manually</div></div>`;
    return;
  }
  filtered.slice().reverse().forEach(d => {
    const s = stageById(d.stageId);
    const div = document.createElement('div');
    div.className = 'dec-item';
    div.innerHTML = `
      <div class="dec-dot" style="background:${s.bg};border-color:${s.border};color:${s.text}">${s.short}</div>
      <div class="dec-card">
        <div class="dec-stage" style="background:${s.bg};border-color:${s.border};color:${s.text}">${s.label}</div>
        <div class="dec-row"><div class="dec-title">${d.title}</div><div class="dec-date">${d.date}</div></div>
        ${d.rationale ? `<div class="dec-rationale">${d.rationale.replace(/\n/g, '<br>')}</div>` : ''}
        <div class="dec-source">via ${d.source}</div>
      </div>`;
    list.appendChild(div);
  });
}

function poiClear() {
  if (tab === 'log') { decisions = []; decId = 1; updateCount(); renderLog(); }
  else { history[tab] = []; renderChat(); }
}

document.getElementById('inp').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); poiSend(); }
});
document.getElementById('inp').addEventListener('input', function () {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 100) + 'px';
});

// initialized via unlock()
</script>
